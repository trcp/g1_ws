x-preferences: &preferences
  privileged: true
  ipc: host
  network_mode: host
  tty: true
  stdin_open: true
  stop_signal: SIGINT
  environment:
    - DISPLAY
    - RMW_IMPLEMENTATION
    # DO NOT EDIT
    - CYCLONEDDS_URI=$HOME/cyclonedds.xml
  devices:
    - /dev:/dev
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix
    - $HOME/.Xauthority/:$HOME/.Xauthority
    - ./src:$HOME/colcon_ws/src/erasers_g1
    - ./rosbag:$HOME/colcon_ws/rosbag
    - ./map:$HOME/colcon_ws/map
    - $HOME/cyclonedds_ws/cyclonedds.xml:$HOME/cyclonedds.xml
    # timezone
    - /etc/localtime:/etc/localtime:ro
  group_add:
    - "dialout"

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [ gpu ]

# ---------------------------------------------------------------
services:
  # =======================
  # Unitree G1 用のコンテナ
  # =======================
  erasers_g1:
    container_name: erasers_g1
    image: erasers_g1:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: robot
      args:
        - TARGET_ARCH=arm64
        - OS=22.04
        - ROS=humble
        - USERNAME=${USER}
        - GROUPNAME=${USER}
        - PASSWORD=123
    <<: *preferences
    command: '/bin/bash -ci " ros2 launch g1_bringup bringup.launch.py"'
    #command: "/bin/bash"

  # =============
  # Katana PC 用
  # =============
  katana:
    container_name: erasers_g1
    image: erasers_g1:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: robot
      args:
        - TARGET_ARCH=cuda.13.0.0
        - OS=22.04
        - ROS=humble
        - USERNAME=${USER}
        - GROUPNAME=${USER}
        - PASSWORD
    <<: [ *preferences, *gpu ]
    volumes:
      - ./cyclonedds:$HOME/cyclonedds
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $HOME/.Xauthority/:$HOME/.Xauthority
      - ./src:$HOME/colcon_ws/src/erasers_g1
      - ./rosbag:$HOME/colcon_ws/rosbag
      - ./map:$HOME/colcon_ws/map
      # timezone
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DISPLAY
      - RMW_IMPLEMENTATION
      # DO NOT EDIT
      - CYCLONEDDS_URI=$HOME/cyclonedds/cyclonedds.xml
    #command: '/bin/bash -ci " ros2 launch g1_bringup bringup.launch.py"'
    command: "/bin/bash -ci \"ros2 launch g1_bringup ptl.launch.py & terminator\""

  # ===============================================
  # G1 内部で rosbag を実行したり検証したりする
  # ===============================================
  devel:
    container_name: devel
    image: erasers_g1:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: robot
      args:
        - TARGET_ARCH=arm64
        - OS=22.04
        - ROS=humble
        - USERNAME=${USER}
        - GROUPNAME=${USER}
    <<: *preferences
    environment:
      - DISPLAY
      - ROS_DOMAIN_ID=100
    command: '/bin/bash -ic "rviz2 -d $(ros2 pkg prefix --share g1_description)/rviz/g1.rviz"'
