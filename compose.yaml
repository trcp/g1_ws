x-preferences: &preferences
  privileged: true
  ipc: host
  network_mode: host
  tty: true
  stdin_open: true
  stop_signal: SIGINT
  environment:
    - DISPLAY
    - RMW_IMPLEMENTATION
    # DO NOT EDIT
    - CYCLONEDDS_URI=$HOME/cyclonedds.xml
  devices:
    - /dev:/dev
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix
    - $HOME/.Xauthority/:$HOME/.Xauthority
    - ./src:$HOME/colcon_ws/src/erasers_g1
    - ./rosbag:$HOME/colcon_ws/rosbag
    - ./map:$HOME/colcon_ws/map
    - $HOME/cyclonedds_ws/cyclonedds.xml:$HOME/cyclonedds.xml
    # timezone
    - /etc/localtime:/etc/localtime:ro

# ---------------------------------------------------------------
services:
  erasers_g1:
    container_name: erasers_g1
    image: erasers_g1:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: robot
      args:
        - TARGET_ARCH=arm64
        - OS=22.04
        - ROS=humble
        - USERNAME=${USER}
        - GROUPNAME=${USER}
    <<: *preferences
    command: '/bin/bash -ci " ros2 launch g1_bringup bringup.launch.py"'
    #command: "/bin/bash"

  devel:
    container_name: devel
    image: erasers_g1:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: robot
      args:
        - TARGET_ARCH=arm64
        - OS=22.04
        - ROS=humble
        - USERNAME=${USER}
        - GROUPNAME=${USER}
    <<: *preferences
    environment:
      - DISPLAY
      - ROS_DOMAIN_ID=100
    command: '/bin/bash -ic "rviz2 -d $(ros2 pkg prefix --share g1_description)/rviz/g1.rviz"'
