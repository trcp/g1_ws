x-preferences: &preferences
  privileged: true
  ipc: host
  network_mode: host
  tty: true
  stdin_open: true
  stop_signal: SIGINT
  environment:
    - DISPLAY
    - RMW_IMPLEMENTATION
    # DO NOT EDIT
    - CYCLONEDDS_URI=$HOME/cyclonedds.xml
  devices:
    - /dev:/dev
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix
    - $HOME/.Xauthority/:$HOME/.Xauthority
    - ./src:$HOME/colcon_ws/src/erasers_g1
    - $HOME/cyclonedds_ws/cyclonedds.xml:$HOME/cyclonedds.xml
  
# ---------------------------------------------------------------
services:
  erasers_g1:
    container_name: erasers_g1
    image: erasers_g1:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: robot
      args:
        - TARGET_ARCH=arm64
        - OS=22.04
        - ROS=humble
        - USERNAME=${USER}
        - GROUPNAME=${USER}
    <<: *preferences
    command: "/bin/bash"
