# ==========
# NVIDIA GPU
# ==========
x-gpu: &gpu
  environment:
    - __NV_PRIME_RENDER_OFFLOAD=1
    - __GLX_VENDOR_LIBRARY_NAME=nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]


# ======
# JETSON
# ======
x-jetson: &jetson
  environment:
    - XAUTHORITY=/tmp/.docker.xauth
    - NVIDIA_DRIVER_CAPABILITIES=all
    - NVIDIA_VISIBLE_DEVICES=all
  volumes:
    - /run/jtop.sock:/run/jtop.sock
    - /tmp/argus_socket:/tmp/argus_socket
    - /etc/enctune.conf:/etc/enctune.conf
    - /etc/nv_tegra_release:/etc/nv_tegra_release
    - /tmp/nv_jetson_model:/tmp/nv_jetson_model
    - /var/run/dbus:/var/run/dbus
    - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
    - /var/run/docker.sock:/var/run/docker.sock
    - /tmp/.X11-unix/:/tmp/.X11-unix
    - /tmp/.docker.xauth:/tmp/.docker.xauth
    - $HOME/.Xauthority/:/root/.Xauthority
  devices:
    - /dev:/dev
  runtime: nvidia


# ===========
# preferences
# ===========
x-preferences: &preferences
  privileged: true
  ipc: host
  network_mode: host
  tty: true
  stdin_open: true
  stop_signal: SIGINT
  environment:
    - DISPLAY=${DISPLAY}
    - LC_TIME
    - TZ=Asia/Tokyo
    - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    - CYCLONEDDS_URI=file:///tmp/cyclonedds/cyclonedds.g1.xml
    # Amazing Hand のデバイスパス
    - AH_PATH="/dev/ttyACM0"
    # 頭部カメラジョイントモーターのデバイスパス
    - DX_PATH="/dev/ttyCH341USB0"
    # 緊急停止ボタンの有効
    - USE_EMC=true
  devices:
    - /dev:/dev
  volumes:
    - ./src:$HOME/colcon_ws/src/erasers_g1
    - ./rosbag:$HOME/colcon_ws/rosbag
    - ./map:$HOME/colcon_ws/map
    - ./cyclonedds:/tmp/cyclonedds


# ---------------------------------------------------------------
services:
  # =======================
  # Unitree G1 用のコンテナ
  # =======================
  erasers_g1:
    container_name: erasers_g1
    image: erasers_g1:latest
    build:
        context: .
        dockerfile: Dockerfile
        target: main
        args:
          - TARGET_ARCH=jetson
          - L4T_VERSION=36.4
          - SOC=t234
          - GLIM_CUDA_VERSION=12.6
          - USERNAME=${USER}
          - GROUPNAME=${USER}
          - PASSWORD=123
          - UID=1000
          - GID=1000
    group_add:
        - "audio"
        - "video"
        - "input"
    <<: [*preferences, *jetson]
    environment:
      - DISPLAY=${DISPLAY}
      - LC_TIME
      - TZ=Asia/Tokyo
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///tmp/cyclonedds/cyclonedds.g1.xml
      - AH_PATH="/dev/ttyACM0"
      - DX_PATH="/dev/ttyCH341USB0"
      - USE_EMC=true
      - XAUTHORITY=/tmp/.docker.xauth
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./src:$HOME/colcon_ws/src/erasers_g1
      - ./rosbag:$HOME/colcon_ws/rosbag
      - ./map:$HOME/colcon_ws/map
      - ./cyclonedds:/tmp/cyclonedds
      - /run/jtop.sock:/run/jtop.sock
      - /tmp/argus_socket:/tmp/argus_socket
      - /etc/enctune.conf:/etc/enctune.conf
      - /etc/nv_tegra_release:/etc/nv_tegra_release
      - /tmp/nv_jetson_model:/tmp/nv_jetson_model
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/.X11-unix/:/tmp/.X11-unix
      - /tmp/.docker.xauth:/tmp/.docker.xauth
      - $HOME/.Xauthority/:/root/.Xauthority
    command: '/bin/bash -ci " ros2 launch g1_bringup bringup.launch.py use_camera:=true"'
    #command: '/bin/bash -ci "terminator"'

  # =============
  # Katana PC 用
  # =============
  katana:
    container_name: katana
    image: erasers_g1:latest
    build:
      context: .
      dockerfile: Dockerfile
      #target: main
      target: robot_tasks
      args:
        - TARGET_ARCH=cuda
        - OS=22.04
        - CUDA=13.0.0
        - ROS=humble
        - USERNAME=${USER}
        - GROUPNAME=${USER}
        - PASSWORD
    <<: [*preferences, *gpu ]
    command: "/bin/bash -ci \"ros2 launch g1_bringup ptl.launch.py & terminator\""

  # ===============================================
  # G1 内部で rosbag を実行したり検証したりする
  # ===============================================
  devel:
    container_name: devel
    image: erasers_g1:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: main
      args:
        - TARGET_ARCH=jetson
        - L4T_VERSION=36.4
        - SOC=t234
        - GLIM_CUDA_VERSION=12.6
        - USERNAME=${USER}
        - GROUPNAME=${USER}
        - PASSWORD
        - UID=1000
        - GID=1000
    <<: [*preferences, *jetson]
    environment:
      - DISPLAY=${DISPLAY}
      - LC_TIME
      - TZ=Asia/Tokyo
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///tmp/cyclonedds/cyclonedds.g1.xml
      - AH_PATH="/dev/ttyACM0"
      - DX_PATH="/dev/ttyCH341USB0"
      - USE_EMC=true
      - XAUTHORITY=/tmp/.docker.xauth
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
      - ROS_DOMAIN_ID=100
    volumes:
      - ./src:$HOME/colcon_ws/src/erasers_g1
      - ./rosbag:$HOME/colcon_ws/rosbag
      - ./map:$HOME/colcon_ws/map
      - ./cyclonedds:/tmp/cyclonedds
      - /run/jtop.sock:/run/jtop.sock
      - /tmp/argus_socket:/tmp/argus_socket
      - /etc/enctune.conf:/etc/enctune.conf
      - /etc/nv_tegra_release:/etc/nv_tegra_release
      - /tmp/nv_jetson_model:/tmp/nv_jetson_model
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/.X11-unix/:/tmp/.X11-unix
      - /tmp/.docker.xauth:/tmp/.docker.xauth
      - $HOME/.Xauthority/:/root/.Xauthority
    #command: '/bin/bash -ic "rviz2 -d $(ros2 pkg prefix --share g1_description)/rviz/g1.rviz"'
    command: '/bin/bash -ic "terminator"'
