services:
  yolo_human:
    build: .
    container_name: yolo_human_node
    network_mode: "host"
    volumes:
      - ./yolo_human_node.py:/app/yolo_human_node.py
      - ../object/rgbd_geometry.py:/app/rgbd_geometry.py:ro
      - ./extract_person_features_off.py:/app/extract_person_features_off.py
      - ./extract_person_features.py:/app/extract_person_features.py
      - ~/.cache:/root/.cache
      - /home/roboworks/g1_ws/cyclonedds/cyclonedds.katana.xml:/tmp/cyclonedds.xml
    env_file:
      - .env
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # 未指定時は実機用の有線IF設定。実機なしの検証では
      # YOLO_CYCLONEDDS_URIを空文字にするとCycloneDDSの自動選択を使う。
      - CYCLONEDDS_URI=${YOLO_CYCLONEDDS_URI-file:///tmp/cyclonedds.xml}
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
    # コンテナが落ちても自動再起動
    restart: unless-stopped

    # GPU使用
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  local_vlm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: local_vlm_server
    network_mode: "host"
    volumes:
      - ~/.cache:/root/.cache
    command: ["-hf", "LiquidAI/LFM2.5-VL-1.6B-Extract-GGUF:Q8_0", "--host", "0.0.0.0", "--port", "8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
