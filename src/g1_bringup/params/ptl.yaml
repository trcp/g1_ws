pointcloud_to_laserscan:
  ros__parameters:
    target_frame: "" # MessageFilterをバイパスし、入力点群のフレームを継承
    queue_size: 2 # 軽量化のため10から2に変更
    transform_tolerance: 0.2
    min_height: -0.8
    max_height: 2.0
    angle_min: -3.14159265359 # -M_PI
    angle_max: 3.14159265359 # M_PI
    angle_increment: 0.0174 # ~1 degree
    scan_time: 0.1
    range_min: 0.25
    range_max: 40.0
    use_inf: true
    inf_epsilon: 1.0
    concurrency_level: 0
