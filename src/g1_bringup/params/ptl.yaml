pointcloud_to_laserscan:
  ros__parameters:
    target_frame: "base_footprint"
    queue_size: 5
    transform_tolerance: 0.2
    min_height: 0.15
    max_height: 3.14
    angle_min: -3.14
    angle_max: 2.0
    angle_increment: 0.0174
    scan_time: 0.1
    range_min: 0.25
    range_max: 40.0
    use_inf: true
    inf_epsilon: 1.0
    concurrency_level: 0
