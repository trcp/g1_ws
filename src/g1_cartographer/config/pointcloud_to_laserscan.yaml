pointcloud_to_laserscan:
  ros__parameters:
    target_frame: mid360_link # Livox frame usually. Or base_link? Let's use mid360_link as source of scan data relative to robot.
    transform_tolerance: 0.2
    min_height: -0.1
    max_height: 1.0
    angle_min: -3.14159265359 # -M_PI
    angle_max: 3.14159265359 # M_PI
    angle_increment: 0.0174 # ~1 degree
    scan_time: 0.1
    range_min: 0.1
    range_max: 100.0
    use_infra: true
    inf_epsilon: 1.0
    # concurrency_level: 1 # If supported, or default
    # queue_size: 10
