pointcloud_to_laserscan_node:
  ros__parameters:
    target_frame: "mid360_link"
    tolerance: 0.01
    min_height: 0.0
    max_height: 1.0
    angle_min: -3.14
    angle_max: 3.14
    angle_increment: 0.0174  # pi / 180
    scan_time: 0.1
    range_min: 0.2
    range_max: 50.0
    inf_epsilon: 1.0
    use_inf: true
