# params/head_servo.yaml
head_servo_node:
  ros__parameters:
    # 通信設定
    dx_path: "/dev/ttyCH341USB0"
    baudrate: 1000000

    # servo 設定
    pan_id: 1
    tilt_id: 2

    # 通信設定
    publish_rate: 10.0

    # 通常駆動時の電流上限 [mA] (Operating Mode 5: Current-based Position Control)
    normal_current_limit_mA: 600

    # 自動キャリブレーション設定 (Mode 5 電流制限コリジョン検知)
    auto_calibrate: true
    calib_velocity: 60                # 探索時のプロファイル設定値
    calib_step_pulse: 8               # 20msごとの前進量 (約35.2 deg/s)
    calib_current_limit_mA: 160       # 探索時の Goal Current 上限 [mA] (軸スリップ・過負荷防止)
    calib_current_threshold_mA: 125   # 衝突判定電流しきい値 [mA] (自重89mA・ケーブル張力105mA超)
    calib_stall_count_threshold: 3    # 衝突確定に必要な連続検知回数 (約60ms)
    calib_backoff_pulse: 25           # 衝突後の安全マージン後退パルス (約2.2度)
    calib_timeout_sec: 10.0           # 1軸あたりの最大探索タイムアウト [秒]

    # キャリブレーション初期値 [pulse] & 基準角 [rad]
    pan_zero: 4021
    tilt_zero: 34
    pan_zero_rad: -0.8727
    tilt_zero_rad: -1.5010            # 実機ストッパー角 (-86.0度: 水平0度補正)

    # URDF joint limits [rad]
    pan_min_rad: -0.7
    pan_max_rad: 0.7
    tilt_min_rad: -1.57
    tilt_max_rad: 1.1

    # +1: positive ROS angle increases Dynamixel pulse
    # -1: positive ROS angle decreases Dynamixel pulse
    pan_dir:  -1
    tilt_dir: 1

    profile_velocity: 1000
