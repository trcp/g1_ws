# params/head_servo.yaml
head_servo_node:
  ros__parameters:
    # 通信設定
    dx_path: "/dev/ttyCH341USB0"
    baudrate: 1000000

    # servo 設定
    pan_id: 1
    tilt_id: 2

    # 通信設定
    publish_rate: 10.0

    # 自動キャリブレーション設定 (コリジョン検知)
    auto_calibrate: true
    calib_velocity: 40                # 探索時のプロファイル速度 (2倍速: 約55 deg/s上限)
    calib_step_pulse: 8               # 20msごとの前進量 (2倍速: 約35.2 deg/s, 5.8 rpm)
    calib_current_limit_mA: 100       # 探索時の電流リミット (XL330保護用)
    calib_current_threshold_mA: 80    # 衝突判定電流しきい値
    calib_stall_count_threshold: 3    # 衝突確定に必要な連続検知回数 (約60ms)
    calib_backoff_pulse: 30           # 衝突後の安全マージン後退パルス (約2.6度)
    calib_timeout_sec: 15.0           # 1軸あたりの最大探索タイムアウト [秒]

    # キャリブレーション基準角 [rad]
    pan_zero_rad: -0.8727
    tilt_zero_rad: -1.5010            # 実機ストッパー角 (-86.0度: 水平0度補正)

    # URDF joint limits [rad]
    pan_min_rad: -0.7
    pan_max_rad: 0.7
    tilt_min_rad: -1.57
    tilt_max_rad: 1.1

    # +1: positive ROS angle increases Dynamixel pulse
    # -1: positive ROS angle decreases Dynamixel pulse
    pan_dir:  -1
    tilt_dir: 1

    profile_velocity: 1000
