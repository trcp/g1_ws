# params/head_servo.yaml
head_servo_node:
  ros__parameters:
    # 通信設定
    dx_path: "/dev/ttyCH341USB0"
    baudrate: 1000000

    # servo 設定
    pan_id: 1
    tilt_id: 2

    # 通信設定
    publish_rate: 10.0

    # Calibration pulses from the existing hardware calibration.
    # These values correspond to the reference angles below, not necessarily
    # the camera-forward 0 rad pose.
    pan_zero: 943
    tilt_zero: 861
    pan_zero_rad: -0.8727
    tilt_zero_rad: -1.5708

    # URDF joint limits [rad]
    pan_min_rad: -0.7
    pan_max_rad: 0.7
    tilt_min_rad: -1.57
    tilt_max_rad: 1.1

    # +1: positive ROS angle increases Dynamixel pulse
    # -1: positive ROS angle decreases Dynamixel pulse
    pan_dir: 1
    tilt_dir: 1

    profile_velocity: 1000
